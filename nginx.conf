events {
    worker_connections 1024;
}

http {
    # Upstream backend servers configuration
    upstream backend_servers {
        # Docker DNS will automatically resolve to all server containers
        # For scaling, Docker will automatically load balance between instances
        server server-vosk:8000 max_fails=3 fail_timeout=30s;
        # Enable keepalive connections for better performance
        keepalive 32;
    }

    # Load balancing method configuration
    # Default is round-robin, but you can change to:
    # least_conn;    # Route to server with fewest active connections
    # ip_hash;       # Route based on client IP hash (sticky sessions)
    
    # Resolver for Docker DNS
    resolver 127.0.0.11 valid=30s;
    
    # Proxy settings for better handling
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Logging configuration
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # WebSocket proxy configuration
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8000;
        server_name server-vosk;
        
        # Health check endpoint
        location /health {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket endpoint
        location /ws {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specific timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
        }

        # All other endpoints
        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}