<!DOCTYPE html>
<html>
<head>
    <title>Test Mezon Auth API</title>
</head>
<body>
    <h1>Test Mezon Auth API</h1>
    <button onclick="testFetch()">Test with Fetch</button>
    <button onclick="testAxios()">Test with Axios</button>
    <pre id="result"></pre>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8002/api/auth/mezon/config';
        const resultEl = document.getElementById('result');

        async function testFetch() {
            resultEl.textContent = 'Testing with fetch()...\n';
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                resultEl.textContent += 'SUCCESS with fetch():\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                resultEl.textContent += 'ERROR with fetch():\n' + error.message;
            }
        }

        async function testAxios() {
            resultEl.textContent = 'Testing with axios...\n';
            try {
                const response = await axios.get(API_URL);
                resultEl.textContent += 'SUCCESS with axios:\n' + JSON.stringify(response.data, null, 2);
            } catch (error) {
                resultEl.textContent += 'ERROR with axios:\n' + error.message;
            }
        }
    </script>
</body>
</html>
