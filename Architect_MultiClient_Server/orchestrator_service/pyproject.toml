[tool.pyrefly]
search-path = [".."]

[tool.ruff]
target-version = "py311"
line-length = 120                     
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # PEP8 Errors: Basic style and formatting violations
    "W",    # PEP8 Warnings: Minor styling issues
    "F",    # Pyflakes: Catch critical logic errors (e.g., unused imports, undefined vars)
    "I",    # Isort: Automatically sort and group imports
    "N",    # Naming conventions: Enforce strict naming rules (e.g., snake_case for vars)
    "UP",   # Pyupgrade: Keep codebase modern and clean
    "B",    # Bugbear: Warn against bad patterns that easily cause hidden bugs
    "SIM",  # Simplify: Make code more concise and readable
    "RUF",  # Ruff-specific: Exclusive rules for best performance and code quality
    "ANN",  # Annotations: Enforce type annotations
]

ignore = [
    "E501",   # Ignore "line too long" (E501) for unbreakable strings/URLs
    "ANN204", # Ignore missing return type annotation for special methods (e.g., __init__)
    "ANN201", # Ignore missing return type annotation for public functions (API endpoints)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
    "orchestrator_service.auth.authorization.require_any_permission",
]

[tool.ruff.lint.isort]
known-first-party = ["orchestrator_service"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]                    # Ignore module level import error because load_dotenv() must be called first

[tool.ruff.format]
quote-style = "double"  # Strictly enforce double quotes "" for all strings

[tool.mypy]
mypy_path = ".."
python_version = "3.11"
warn_return_any = true                  # Warn when a function returns Any
disallow_untyped_defs = false           # Don't require type annotations on all functions (gradual adoption)
check_untyped_defs = true               # Still type-check function bodies even without annotations
strict_optional = true                  # Distinguish between Optional[X] and X (None safety)
warn_unreachable = true                 # Warn about unreachable code after return/raise
disallow_any_explicit = true            # Disallow explicit usage of Any
disallow_any_generics = true            # Disallow generic types without passing type parameters

[[tool.mypy.overrides]]
module = [
    "openai.*",
    "httpx.*",
    "google.*",
    "livekit.*",
    "redis.*",
    "tenacity.*",
    "uvicorn.*",
]
ignore_missing_imports = true
