services:
  # FastAPI Server với Vosk
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    # container_name: mezon-vosk-server   # ❌ removed for scaling
    ports:
      - "8000"   # let Docker assign internal port
    env_file:
      - Architect_MultiClient_Server/Server/.env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - VOSK_MODEL_PATH=${VOSK_MODEL_PATH}
    volumes:
      # Mount thư mục models để có thể thay đổi model mà không cần rebuild
      - ./models:/app/models
      # Mount thư mục logs để xem logs từ bên ngoài
      - ./logs:/app/logs
    networks:
      - mezon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/simple"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
    networks:
      - mezon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # LiveKit Agent
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: mezon-livekit-agent
    # No host port mapping needed; agent connects internally to nginx and bot
    env_file:
      - Architect_MultiClient_Server/agents/.env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    depends_on:
      nginx:
        condition: service_started
    networks:
      - mezon-network
    restart: unless-stopped

  # Mezon Transcript Bot (Node)
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: mezon-transcript-bot
    ports:
      - "8080:8080"
    env_file:
      - Architect_MultiClient_Server/bot/.env
    environment:
      - NODE_ENV=production
    depends_on:
      - nginx
    networks:
      - mezon-network
    restart: unless-stopped

networks:
  mezon-network:
    driver: bridge

volumes:
  # Persistent volume cho models
  models:
    driver: local
  # Persistent volume cho logs
  logs:
    driver: local
 