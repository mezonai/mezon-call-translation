version: '3.8'

services:
  # FastAPI Server với Vosk
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: mezon-vosk-server
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - VOSK_MODEL_PATH=${VOSK_MODEL_PATH}
    volumes:
      # Mount thư mục models để có thể thay đổi model mà không cần rebuild
      - ./models:/app/models
      # Mount thư mục logs để xem logs từ bên ngoài
      - ./logs:/app/logs
    networks:
      - mezon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/simple"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # LiveKit Agent
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: mezon-livekit-agent
    ports:
      - "8080:8080"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # LiveKit environment variables (cần được set trong .env)
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      # WebSocket server URL cho agent
      - WEBSOCKET_HOST=server
      - WEBSOCKET_PORT=8000
    depends_on:
      server:
        condition: service_healthy
    networks:
      - mezon-network
    restart: unless-stopped

networks:
  mezon-network:
    driver: bridge

volumes:
  # Persistent volume cho models
  models:
    driver: local
  # Persistent volume cho logs
  logs:
    driver: local
