# Prometheus Configuration for Mezon Call Translation Service

global:
  scrape_interval: 15s # Scrape targets every 15 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds
  scrape_timeout: 10s
  external_labels:
    cluster: 'mezon-call-translation'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Mezon Server - All Instances
  # Docker Compose creates containers with predictable names: service-name-N
  # We scrape each instance directly by container name
  - job_name: 'mezon-server-instances'
    metrics_path: '/metrics'
    static_configs:
      # Server instance 1
      - targets: ['mezon-call-translation-server-1:8000']
        labels:
          service: 'mezon-server'
          component: 'backend'
          instance: 'server-1'
      # Server instance 2
      - targets: ['mezon-call-translation-server-2:8000']
        labels:
          service: 'mezon-server'
          component: 'backend'
          instance: 'server-2'
      # Server instance 3
      - targets: ['mezon-call-translation-server-3:8000']
        labels:
          service: 'mezon-server'
          component: 'backend'
          instance: 'server-3'
      # Add more instances here if you scale beyond 3
      # - targets: ['mezon-call-translation-server-4:8000']
      #   labels:
      #     service: 'mezon-server'
      #     component: 'backend'
      #     instance: 'server-4'

  # Nginx Load Balancer - for monitoring nginx itself (optional)
  # Note: This only monitors nginx, not the backend servers
  # - job_name: 'nginx-lb'
  #   metrics_path: '/metrics'
  #   static_configs:
  #     - targets: ['nginx:8000']
  #       labels:
  #         service: 'nginx'
  #         component: 'load-balancer'

  # Grafana self-monitoring
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'

  # AlertManager self-monitoring
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'

  # Node Exporter (if you add it later for system metrics)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'node-exporter'

  # cAdvisor (if you add it later for container metrics)
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
  #       labels:
  #         service: 'cadvisor'
