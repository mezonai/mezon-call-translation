# Grafana Datasource Configuration - Auto-provision Prometheus

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      # Enable Prometheus features
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      # Cache settings
      cacheLevel: 'High'
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m
      # Query settings
      customQueryParameters: ''
      disableMetricsLookup: false
      # Exemplars
      exemplarTraceIdDestinations: []
    version: 1
