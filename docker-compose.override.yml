# Override file cho development

services:
  server-vosk:
    # Enable hot reload cho development
    volumes:
      - ./Architect_MultiClient_Server/server_vosk:/app/server_vosk
    environment:
      - PYTHONUNBUFFERED=1
      - RELOAD=true
    command: ["python", "-m", "uvicorn", "server_vosk.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  agent:
    # Enable hot reload cho development
    volumes:
      - ./Architect_MultiClient_Server/agents:/app/agents
    environment:
      - PYTHONUNBUFFERED=1
      - RELOAD=true

  bot:
    # Enable hot reload for bot with nodemon in development
    working_dir: /app/bot
    environment:
      - NODE_ENV=development
      - npm_config_build_from_source=true
    volumes:
      - ./Architect_MultiClient_Server/bot:/app/bot
      - /app/bot/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm rebuild better-sqlite3 --build-from-source || true && npx nodemon index.js"
    ports:
      - "8080:8080"